# Configuração do Alembic — Lavconta
#
# A URL do banco NÃO fica aqui: é lida de variável de ambiente em
# migrations/env.py, via app.core.config. Este arquivo é versionado e não pode
# conter credencial.

[alembic]
script_location = migrations
prepend_sys_path = .

# nome dos arquivos de migração: data + slug, para ordenação legível
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# fuso usado no nome do arquivo
timezone = America/Sao_Paulo

[post_write_hooks]
# formata a migração gerada com o mesmo padrão do resto do código
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

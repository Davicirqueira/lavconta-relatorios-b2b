[project]
name = "lavconta-api"
version = "1.0.0"
description = "API de relatórios B2B da Lavandix"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# a raiz do backend entra no sys.path para os testes importarem "app" e "tests"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ANN"]
ignore = [
    "ANN401",  # permite Any onde é legítimo (detalhes de erro)
    # N818 exige sufixo "Error" em exceção (convenção inglesa). Nossos nomes de
    # domínio são em português e usam "Erro" como PREFIXO — ErroDeDominio,
    # ErroDeConfiguracao — o que cumpre a intenção da regra (a exceção é
    # reconhecível como erro pelo nome). Renomear geraria mistura de idiomas.
    # Decisão alinhada ao steering structure.md: nomes de domínio em português.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# testes podem usar assert e não exigem anotação completa
"tests/**" = ["S101", "ANN001", "ANN201"]

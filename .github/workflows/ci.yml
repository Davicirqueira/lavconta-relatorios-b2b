# ==========================================================================
# CI do Lavconta
#
# Em cada push e pull request: lint, testes, build e verificações de segurança.
# PR não deve ser mesclado com CI vermelho (engineering.md §7).
#
# Versões das actions fixadas em tag de release específica (não em major
# flutuante), conferidas na API do GitHub em 24/09/2026.
# ==========================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o token do workflow só precisa ler o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo branch para não desperdiçar runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  backend:
    name: Backend — lint, testes e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@v7.0.0
        with:
          # espelha a versão usada em desenvolvimento
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências (versões fixadas)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Formatação (ruff)
        run: python -m ruff format --check .

      - name: Testes (pytest)
        # As variáveis de ambiente são definidas pelo conftest com valores
        # fictícios: o CI não precisa de nenhum segredo real para testar.
        run: python -m pytest

      - name: Auditoria de vulnerabilidades (pip-audit)
        # Audita o AMBIENTE INSTALADO, não o requirements.txt: cobre também as
        # dependências transitivas (ex.: pillow via reportlab), que a auditoria
        # do arquivo deixaria de fora.
        run: python -m pip_audit --strict

  # ------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # O frontend é criado na tarefa 35. Até lá, o job passa sem executar
      # etapas, em vez de falhar por ausência de package.json.
      - name: Verificar se o frontend já existe
        id: verificar
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Frontend ainda não inicializado (tarefa 35). Etapas ignoradas."
          fi

      - name: Preparar Node
        if: steps.verificar.outputs.existe == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (respeitando o lockfile)
        if: steps.verificar.outputs.existe == 'true'
        working-directory: frontend
        # npm ci respeita o package-lock.json e falha se houver divergência
        run: npm ci

      - name: Lint
        if: steps.verificar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Testes
        if: steps.verificar.outputs.existe == 'true'
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        if: steps.verificar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run build

      - name: Auditoria de vulnerabilidades (npm audit)
        if: steps.verificar.outputs.existe == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------------
  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest

    env:
      # Versão e checksum oficiais, conferidos na API de releases do GitHub.
      GITLEAKS_VERSAO: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # histórico completo: o segredo pode estar em commit antigo, não só
          # no último
          fetch-depth: 0

      # Usamos o binário oficial (MIT) em vez da gitleaks-action, que exige
      # GITLEAKS_LICENSE para repositórios de organização. Assim o CI não
      # depende de licença nem quebra se o repositório mudar de dono.
      - name: Baixar gitleaks e verificar integridade
        run: |
          set -euo pipefail
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          curl --fail --location --silent --show-error --output "$arquivo" "$url"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" gitleaks
          chmod +x gitleaks

      - name: Varrer repositório
        # --redact impede que um segredo encontrado seja impresso no log do CI,
        # que é público. Saída diferente de zero reprova o job.
        run: ./gitleaks detect --source . --no-banner --redact --verbose
